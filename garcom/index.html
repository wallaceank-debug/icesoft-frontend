<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comanda Mobile - Icesoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/garcom/style.css">
</head>
<body>

    <header class="header-garcom">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="material-symbols-outlined" id="btn-voltar-header" style="font-size: 28px; display: none; cursor: pointer;" onclick="voltarParaMesas()">arrow_back</span>
            <span class="material-symbols-outlined" id="icone-header" style="font-size: 28px;">restaurant_menu</span>
            <h1 id="titulo-header" style="margin: 0; font-size: 1.2rem;">Mapa de Mesas</h1>
        </div>
        <a href="../pdv/index.html" style="color: white; text-decoration: none;"><span class="material-symbols-outlined">exit_to_app</span></a>
    </header>

    <div id="tela-mesas" class="tela-mesas">
        
        <!-- 👇 NOVO: Botão de Comanda Rápida -->
        <button class="btn-nova-mesa-mobile" style="background: #e91e63; margin-bottom: 10px; border: none; padding: 15px; border-radius: 12px; color: white; font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);" onclick="abrirComandaRapida()">
            <span class="material-symbols-outlined">receipt_long</span> Lançar Comanda (Balcão)
        </button>

        <button class="btn-nova-mesa-mobile" onclick="abrirModalNovaMesaMobile()">
            <span class="material-symbols-outlined">add</span> Abrir Nova Mesa Livre
        </button>
        <div id="lista-mesas-mobile" style="display: flex; flex-direction: column; gap: 10px;">
            <p style="text-align: center; color: #888;">Carregando mesas...</p>
        </div>
    </div>

    <div id="tela-produtos" style="display: none;">
        <div class="scroll-categorias" id="menu-categorias"></div>
        <div class="lista-produtos" id="lista-produtos"></div>
    </div>

    <div class="carrinho-flutuante" id="carrinho-flutuante" style="display: none;" onclick="abrirResumoPedido()">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="material-symbols-outlined">shopping_cart</span>
            <span id="carrinho-qtd" style="font-weight: bold; background: white; color: #e91e63; padding: 2px 8px; border-radius: 12px; font-size: 0.9rem;">0</span>
        </div>
        <span id="carrinho-total" style="font-weight: bold; font-size: 1.1rem;">R$ 0,00</span>
    </div>

    <div id="modal-adicionais" class="modal-overlay" style="display: none;">
        <div class="bottom-sheet">
            <div class="sheet-header">
                <h3 id="modal-prod-nome">Nome do Produto</h3>
                <span class="material-symbols-outlined" onclick="fecharModalAdicionais()" style="cursor: pointer; color: #888;">close</span>
            </div>
            <div id="modal-prod-adicionais" class="sheet-body"></div>
            <div class="sheet-footer">
                <button class="btn-primario" onclick="confirmarItem()">Adicionar <span id="modal-prod-preco">R$ 0,00</span></button>
            </div>
        </div>
    </div>

    <div id="modal-resumo" class="modal-overlay" style="display: none;">
        <div class="bottom-sheet" style="height: 90vh; max-height: 90vh;">
            <div class="sheet-header">
                <h3>🛒 Enviar para Mesa</h3>
                <span class="material-symbols-outlined" onclick="fecharResumo()" style="cursor: pointer; color: #888;">close</span>
            </div>
            <div class="sheet-body" id="lista-resumo" style="flex: 1; overflow-y: auto;"></div>
            <div class="sheet-footer" style="flex-direction: column; gap: 10px;">
                <button class="btn-primario" onclick="enviarComanda()" id="btn-enviar-comanda" style="width: 100%; background: #25D366;">
                    <span class="material-symbols-outlined">send</span> Enviar para Cozinha
                </button>
            </div>
        </div>
    </div>

    <div id="modal-pagamento-mobile" class="modal-overlay" style="display: none;">
        <div class="bottom-sheet" style="height: 95vh; max-height: 95vh; padding: 0;">
            <div class="sheet-header" style="padding: 20px; background: #f44336; color: white; margin: 0; border-radius: 20px 20px 0 0;">
                <h3 id="titulo-pagamento-mobile" style="margin: 0;">Pagamento</h3>
                <span class="material-symbols-outlined" onclick="fecharPagamentoMobile()" style="cursor: pointer;">close</span>
            </div>
            
            <div class="sheet-body" style="flex: 1; overflow-y: auto; padding: 15px; background: #f0f2f5;">
                <h4 style="margin-bottom: 10px; color: #555;">Itens na Mesa (Clique em Pagar ⬇)</h4>
                <div id="pag-itens-mesa" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;"></div>

                <div style="background: #e0f7fa; padding: 15px; border-radius: 12px; border: 1px solid #00bcd4; margin-bottom: 20px;">
                    <h4 style="margin: 0 0 10px 0; color: #00838f;">Sendo Pago Agora: <span id="pag-subtotal">R$ 0,00</span></h4>
                    <div id="pag-itens-selecionados" style="display: flex; flex-direction: column; gap: 8px;"></div>
                </div>

                <div style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #ddd;">
                    <label style="font-weight: bold; font-size: 0.9rem;">Forma de Pagamento 1:</label>
                    <select id="pag-metodo-1" class="input-pagamento">
                        <option value="Dinheiro">💵 Dinheiro</option>
                        <option value="PIX">💠 PIX</option>
                        <option value="Cartão de Crédito">💳 Cartão de Crédito</option>
                        <option value="Cartão de Débito">💳 Cartão de Débito</option>
                    </select>
                    <input type="number" id="pag-valor-1" class="input-pagamento" readonly>
                    
                    <button id="btn-dividir-pagamento" onclick="togglePagamentoDivididoMobile()" style="width:100%; margin-top:15px; padding:10px; border:1px dashed #00bcd4; color:#00bcd4; background:none; border-radius:8px; font-weight:bold; cursor: pointer;">+ Dividir em 2 Pagamentos</button>
                    
                    <div id="area-pag-2" style="display:none; margin-top:15px; padding-top:15px; border-top:1px dashed #ccc;">
                        <label style="font-weight: bold; font-size: 0.9rem;">Forma de Pagamento 2:</label>
                        <select id="pag-metodo-2" class="input-pagamento">
                            <option value="PIX">💠 PIX</option>
                            <option value="Cartão de Crédito">💳 Cartão de Crédito</option>
                            <option value="Cartão de Débito">💳 Cartão de Débito</option>
                            <option value="Dinheiro">💵 Dinheiro</option>
                        </select>
                        <input type="number" id="pag-valor-2" class="input-pagamento" readonly style="background:#eee;">
                    </div>
                </div>
            </div>
            
            <div class="sheet-footer" style="padding: 20px; background: white; box-shadow: 0 -4px 10px rgba(0,0,0,0.05);">
                <button class="btn-primario" style="background: #4CAF50;" onclick="finalizarPagamentoMobile()" id="btn-finalizar-pag-mobile">Confirmar Pagamento</button>
            </div>
        </div>
    </div>

    <!-- 👇 NOVO: Área Invisível para Impressão da Comanda -->
    <div id="cupom-impressao" style="display: none; padding: 10px; font-family: monospace; color: black; background: white;"></div>

    <!-- 👇 NOVO: Estilo CSS que esconde o sistema inteiro e mostra só o papel na hora de imprimir -->
    <style>
        @media print {
            body * { display: none !important; }
            #cupom-impressao, #cupom-impressao * { display: block !important; }
            #cupom-impressao { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; }
        }
    </style>

    <script src="/garcom/app.js"></script>
</body>
</html>
