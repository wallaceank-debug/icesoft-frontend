<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos Financeiros - Icesoft</title>
    <link rel="stylesheet" href="../pdv/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .fin-container { padding: 20px; flex: 1; overflow-y: auto; background-color: #f4f7f6; }
        .graficos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .grafico-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .grafico-card.full-width { grid-column: span 2; }
        .grafico-card h3 { text-align: center; color: #333; margin-top: 0; margin-bottom: 20px; font-size: 1.1rem; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>

    <aside class="menu-lateral">
        <h2 style="color: white; font-size: 1.5rem; text-align: center; margin-bottom: 20px; white-space: nowrap; overflow: hidden;"> <span class="menu-texto">ConvertMenu</span></h2>
        <a href="../pdv/" class="menu-item">
            <span class="menu-icone material-symbols-outlined" style="position: relative;">
                point_of_sale
                <span class="notification-badge" id="online-notification-badge" style="display: none; background-color: #25D366;">0</span>
            </span>
            <span class="menu-texto">Balcão PDV</span>
        </a>
        <a href="../financeiro/" class="menu-item ativo"><span class="menu-icone">🏦</span><span class="menu-texto">Financeiro</span></a>
        <div class="menu-item" onclick="window.location.href='../pdv/'" style="cursor: pointer; margin-top: auto; margin-bottom: 20px;">
            <span class="menu-icone">⬅️</span><span class="menu-texto">Voltar ao PDV</span>
        </div>
    </aside>

    <div class="conteudo-principal">
        <header class="pdv-header" style="background-color: #333;">
            <div class="logo-area"><h1>📈 ANÁLISE VISUAL (MÊS ATUAL)</h1></div>
            <button onclick="window.location.href='index.html'" style="padding: 8px 15px; background: #6200ea; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">⬅️ Voltar ao Resumo</button>
        </header>

        <main class="fin-container">
            <div class="graficos-grid">
                <div class="grafico-card full-width">
                    <h3>Balanço do Mês (Entradas vs Saídas)</h3>
                    <canvas id="graficoBalanco"></canvas>
                </div>
                
                <div class="grafico-card">
                    <h3>Onde o dinheiro está indo? (Despesas)</h3>
                    <canvas id="graficoDespesas"></canvas>
                </div>

                <div class="grafico-card">
                    <h3>Faturamento por Canal de Venda</h3>
                    <canvas id="graficoCanais"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'https://icesoft-sistema-icesoft-api-v2.tm3i9u.easypanel.host/api';

        window.onload = async () => {
            try {
                const res = await fetch(`${API_URL}/financeiro/graficos`);
                const dados = await res.json();
                
                // 1. Gráfico de Barras (Receitas x Despesas)
                new Chart(document.getElementById('graficoBalanco'), {
                    type: 'bar',
                    data: {
                        labels: ['Mês Atual'],
                        datasets: [
                            { label: 'Receitas (R$)', data: [dados.resumo_mes.receitas], backgroundColor: '#4CAF50', borderRadius: 8 },
                            { label: 'Despesas (R$)', data: [dados.resumo_mes.despesas], backgroundColor: '#f44336', borderRadius: 8 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
                });

                // Paleta de cores gerada automaticamente para os gráficos de pizza
                const coresPizza = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#E7E9ED', '#8D6E63'];

                // 2. Gráfico Donut (Despesas por Categoria)
                const despesasLabels = dados.despesas_pizza.map(d => d.nome.substring(0, 25) + '...');
                const despesasValores = dados.despesas_pizza.map(d => parseFloat(d.total));
                new Chart(document.getElementById('graficoDespesas'), {
                    type: 'doughnut',
                    data: {
                        labels: despesasLabels.length > 0 ? despesasLabels : ['Nenhuma Despesa'],
                        datasets: [{ data: despesasValores.length > 0 ? despesasValores : [1], backgroundColor: coresPizza }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
                });

                // 3. Gráfico Donut (Canais de Venda)
                const canaisLabels = dados.canais_venda.map(c => c.origem || 'Diversos');
                const canaisValores = dados.canais_venda.map(c => parseFloat(c.total));
                new Chart(document.getElementById('graficoCanais'), {
                    type: 'doughnut',
                    data: {
                        labels: canaisLabels.length > 0 ? canaisLabels : ['Sem Vendas'],
                        datasets: [{ data: canaisValores.length > 0 ? canaisValores : [1], backgroundColor: coresPizza }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
                });

            } catch (e) {
                console.error("Erro ao desenhar gráficos:", e);
                alert("Erro ao carregar dados do servidor para os gráficos.");
            }
        };
    </script>
</body>
</html>
