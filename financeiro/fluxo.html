<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Caixa - Icesoft</title>
    <link rel="stylesheet" href="../pdv/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        .fin-container { padding: 20px; flex: 1; overflow-y: auto; background-color: #f4f7f6; }
        .fluxo-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        
        .fluxo-table { width: 100%; border-collapse: collapse; min-width: 1400px; font-size: 0.95rem; }
        .fluxo-table th, .fluxo-table td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #f0f0f0; }
        .fluxo-table th:first-child, .fluxo-table td:first-child { text-align: left; font-weight: 600; color: #555; position: sticky; left: 0; background: white; border-right: 2px solid #eee; z-index: 2;}
        
        .fluxo-table th { background-color: #f8f9fa; color: #333; font-weight: bold; border-bottom: 2px solid #ddd; vertical-align: top; }
        
        .linha-grupo td { background-color: #e0f7fa; font-weight: 700; color: #00838f; border-top: 2px solid #b2ebf2; border-bottom: 2px solid #b2ebf2;}
        .linha-grupo.despesa td { background-color: #ffebee; color: #c62828; border-top: 2px solid #ffcdd2; border-bottom: 2px solid #ffcdd2;}
        
        .linha-saldo td { background-color: #333; color: white !important; font-weight: bold; font-size: 1.1rem; }
        .linha-saldo td:first-child { background-color: #222; }
        
        .valor-positivo { color: #4CAF50; font-weight: bold; }
        .valor-negativo { color: #f44336; font-weight: bold; }

        /* 👇 NOVO: Estilos das subcontas (Visão Completa) */
        .fluxo-detalhes td { background-color: #fafafa; color: #777; font-size: 0.85rem; border-bottom: 1px solid #f0f0f0; }
        .fluxo-detalhes td:first-child { padding-left: 35px !important; position: sticky; left: 0; background-color: #fafafa; border-right: 2px solid #eee; z-index: 2; font-weight: 500; }
    </style>
</head>
<body>

    <aside class="menu-lateral">
        <h2 style="color: white; font-size: 1.5rem; text-align: center; margin-bottom: 20px; white-space: nowrap; overflow: hidden;"> <span class="menu-texto">ConvertMenu</span></h2>
        <a href="../pdv/" class="menu-item"><span class="menu-icone material-symbols-outlined">point_of_sale</span></a>
        <a href="../financeiro/" class="menu-item ativo"><span class="menu-icone material-symbols-outlined">account_balance</span></a>
    </aside>

    <div class="conteudo-principal">
        <header class="pdv-header" style="background-color: #00bcd4;">
            <div class="logo-area"><h1>📆 FLUXO DE CAIXA (REALIZADO & PREVISTO)</h1></div>
            <button onclick="window.location.href='index.html'" style="padding: 8px 15px; background: #6200ea; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">⬅️ Voltar ao Resumo</button>
        </header>

        <main class="fin-container">
            <div class="fluxo-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2 style="margin-top: 0; color: #333; margin-bottom: 0;">Evolução e Previsão Financeira (12 Meses)</h2>
                    
                    <!-- 👇 NOVO: Botão de alternância -->
                    <button id="btn-visao" onclick="toggleVisao()" style="padding: 8px 15px; background: #00bcd4; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,188,212,0.3);">
                        <span class="material-symbols-outlined" style="font-size:1.1rem;">visibility</span> Visão Completa
                    </button>
                </div>

                <div id="tabela-container">
                    <p style="color: #666; font-style: italic;">Carregando panorama de caixa...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'https://icesoft-sistema-icesoft-api-v2.tm3i9u.easypanel.host/api';
        let visaoDetalhada = false;

        const formatarMes = (str) => {
            const [y, m] = str.split('-');
            const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            return `${meses[parseInt(m)-1]}/${y.substring(2)}`;
        };

        const fMoeda = (val) => `R$ ${val.toFixed(2).replace('.', ',')}`;

        // 👇 MÁGICA: Controla as linhas abertas e fechadas
        window.toggleVisao = () => {
            visaoDetalhada = !visaoDetalhada;
            const btn = document.getElementById('btn-visao');
            const detalhes = document.querySelectorAll('.fluxo-detalhes');
            if (visaoDetalhada) {
                btn.innerHTML = `<span class="material-symbols-outlined" style="font-size:1.1rem;">visibility_off</span> Visão Resumida`;
                btn.style.background = '#607d8b';
                detalhes.forEach(el => el.style.display = 'table-row');
            } else {
                btn.innerHTML = `<span class="material-symbols-outlined" style="font-size:1.1rem;">visibility</span> Visão Completa`;
                btn.style.background = '#00bcd4';
                detalhes.forEach(el => el.style.display = 'none');
            }
        };

        // Extrai todos os nomes de subcontas que existiram nesses 12 meses
        const getUniqueNames = (dados, bucket) => {
            const names = new Set();
            dados.forEach(d => { if(d.detalhes[bucket]) d.detalhes[bucket].forEach(item => names.add(item.nome)); });
            return Array.from(names).sort();
        };

        // Renderiza a linha escondida para uma subconta específica percorrendo os 12 meses
        const renderDetalhesFluxo = (dados, bucket) => {
            let html = '';
            const nomes = getUniqueNames(dados, bucket);
            nomes.forEach(nome => {
                html += `<tr class="fluxo-detalhes" style="display: none;">`;
                html += `<td><span class="material-symbols-outlined" style="font-size: 1rem; vertical-align: middle; margin-right: 5px; color: #ccc;">subdirectory_arrow_right</span> ${nome}</td>`;
                
                dados.forEach(d => {
                    const item = d.detalhes[bucket].find(i => i.nome === nome);
                    const valor = item ? item.total : 0;
                    html += `<td>${valor > 0 ? fMoeda(valor) : '<span style="color:#ccc;">-</span>'}</td>`;
                });
                
                html += `</tr>`;
            });
            return html;
        };

        window.onload = async () => {
            try {
                const cracha = localStorage.getItem('icesoft_token');
                const res = await fetch(`${API_URL}/financeiro/fluxo-caixa`, {
                    headers: { 'Authorization': `Bearer ${cracha}` }
                });

                if (res.status === 401 || res.status === 403) {
                     window.location.href = '../login/index.html';
                     return;
                }
                const dados = await res.json();

                const dataAtual = new Date();
                const mesAtualStr = `${dataAtual.getFullYear()}-${String(dataAtual.getMonth() + 1).padStart(2, '0')}`;

                let html = `<table class="fluxo-table">`;
                
                // --- CABEÇALHO ---
                html += `<tr><th>Categorias</th>`;
                dados.forEach(d => {
                    let badge = '';
                    if (d.mes < mesAtualStr) badge = '<br><span style="color:#999; font-size:0.75rem; font-weight:normal;">(Realizado)</span>';
                    else if (d.mes === mesAtualStr) badge = '<br><span style="color:#2196F3; font-size:0.75rem; font-weight:bold;">(Atual)</span>';
                    else badge = '<br><span style="color:#FF9800; font-size:0.75rem; font-weight:bold;">(Previsto)</span>';
                    
                    html += `<th style="text-align: right; line-height: 1.2;">${formatarMes(d.mes)}${badge}</th>`;
                });
                html += `</tr>`;

                // --- BLOCO DE RECEITAS ---
                html += `<tr><td>(+) Vendas (PDV/Delivery)</td>`;
                dados.forEach(d => html += `<td class="valor-positivo">${fMoeda(d.receita_vendas)}</td>`);
                html += `</tr>`;

                html += `<tr><td>(+) Outras Receitas/Aportes</td>`;
                dados.forEach(d => html += `<td class="valor-positivo">${fMoeda(d.receitas_manuais)}</td>`);
                html += `</tr>`;
                html += renderDetalhesFluxo(dados, 'receitas_manuais'); // Injeta Subcontas
                
                html += `<tr class="linha-grupo"><td>(=) TOTAL DE ENTRADAS</td>`;
                dados.forEach(d => html += `<td>${fMoeda(d.receita_total)}</td>`);
                html += `</tr>`;

                // --- BLOCO DE DESPESAS ---
                html += `<tr><td>(-) C.M.V (Insumos/Embalagens)</td>`;
                dados.forEach(d => html += `<td class="valor-negativo">${fMoeda(d.cmv)}</td>`);
                html += `</tr>`;
                html += renderDetalhesFluxo(dados, 'cmv'); // Injeta Subcontas

                html += `<tr><td>(-) Despesas Operacionais (Aluguel/Folha)</td>`;
                dados.forEach(d => html += `<td class="valor-negativo">${fMoeda(d.desp_op)}</td>`);
                html += `</tr>`;
                html += renderDetalhesFluxo(dados, 'despesas_operacionais'); // Injeta Subcontas

                html += `<tr><td>(-) Despesas com Vendas (Motoboy/MKT)</td>`;
                dados.forEach(d => html += `<td class="valor-negativo">${fMoeda(d.desp_vendas)}</td>`);
                html += `</tr>`;
                html += renderDetalhesFluxo(dados, 'despesas_vendas'); // Injeta Subcontas

                html += `<tr><td>(-) Impostos e Taxas</td>`;
                dados.forEach(d => html += `<td class="valor-negativo">${fMoeda(d.impostos)}</td>`);
                html += `</tr>`;
                html += renderDetalhesFluxo(dados, 'deducoes'); // Injeta Subcontas

                html += `<tr><td>(-) Despesas Financeiras e Investimentos</td>`;
                dados.forEach(d => html += `<td class="valor-negativo">${fMoeda(d.financeiras + d.investimentos)}</td>`);
                html += `</tr>`;
                html += renderDetalhesFluxo(dados, 'financeiras_invest'); // Injeta Subcontas

                html += `<tr class="linha-grupo despesa"><td>(=) TOTAL DE SAÍDAS</td>`;
                dados.forEach(d => html += `<td>${fMoeda(d.despesa_total)}</td>`);
                html += `</tr>`;

                // --- BLOCO FINAL ---
                html += `<tr class="linha-saldo"><td>RESULTADO DO MÊS (SOBRA)</td>`;
                dados.forEach(d => {
                    const corStr = d.saldo_mes >= 0 ? '#4CAF50' : '#f44336';
                    html += `<td style="color: ${corStr} !important;">${fMoeda(d.saldo_mes)}</td>`;
                });
                html += `</tr></table>`;

                document.getElementById('tabela-container').innerHTML = html;

            } catch (e) {
                document.getElementById('tabela-container').innerHTML = `<p style="color: red;">Erro ao gerar relatório de Fluxo de Caixa.</p>`;
            }
        };
    </script>
</body>
</html>
