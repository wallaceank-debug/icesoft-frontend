<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Funil de Vendas - Icesoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container-funil { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #e91e63; margin-bottom: 40px; }
        
        .etapa-funil { display: flex; align-items: center; margin-bottom: 15px; position: relative; }
        .barra-funil { height: 50px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; border-radius: 8px; transition: width 1s ease-in-out; min-width: 100px; }
        .info-etapa { margin-left: 20px; flex: 1; }
        .percentual { font-size: 0.85rem; color: #888; }

        /* Cores do Funil (Do mais largo ao mais estreito) */
        #barra-visitantes { background: #34495e; width: 100%; }
        #barra-visualizacoes { background: #2c3e50; width: 80%; }
        #barra-carrinho { background: #2980b9; width: 60%; }
        #barra-checkout { background: #16a085; width: 40%; }
        #barra-vendas { background: #27ae60; width: 20%; }

        .metricas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; border-top: 2px solid #eee; padding-top: 30px; }
        .card-metrica { background: #f9f9f9; padding: 15px; border-radius: 12px; text-align: center; }
        .card-metrica strong { display: block; font-size: 1.5rem; color: #e91e63; }
        .card-metrica span { font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <div class="container-funil">
        <h1>📊 Funil de Vendas Online</h1>
        
        <div id="corpo-funil">
            <div class="etapa-funil">
                <div id="barra-visitantes" class="barra-funil">Visitantes</div>
                <div class="info-etapa"><strong id="val-visitantes">0</strong> <br> <span class="percentual">100% do tráfego</span></div>
            </div>
            <div class="etapa-funil">
                <div id="barra-visualizacoes" class="barra-funil">Interesse</div>
                <div class="info-etapa"><strong id="val-visualizacoes">0</strong> <br> <span class="percentual" id="per-visualizacoes">0% abriram produtos</span></div>
            </div>
            <div class="etapa-funil">
                <div id="barra-carrinho" class="barra-funil">Desejo</div>
                <div class="info-etapa"><strong id="val-carrinho">0</strong> <br> <span class="percentual" id="per-carrinho">0% usaram o carrinho</span></div>
            </div>
            <div class="etapa-funil">
                <div id="barra-checkout" class="barra-funil">Decisão</div>
                <div class="info-etapa"><strong id="val-checkout">0</strong> <br> <span class="percentual" id="per-checkout">0% foram pagar</span></div>
            </div>
            <div class="etapa-funil">
                <div id="barra-vendas" class="barra-funil">Conversão</div>
                <div class="info-etapa"><strong id="val-vendas">0</strong> <br> <span class="percentual" id="per-vendas">0% compraram</span></div>
            </div>
        </div>

        <div class="metricas-grid">
            <div class="card-metrica">
                <strong id="met-conversao">0%</strong>
                <span>Taxa de Conversão Geral</span>
            </div>
            <div class="card-metrica">
                <strong id="met-abandono">0%</strong>
                <span>Abandono de Checkout</span>
            </div>
            <div class="card-metrica">
                <strong id="met-eficiencia">0%</strong>
                <span>Eficiência de Vitrine</span>
            </div>
        </div>
        
        <button onclick="window.history.back()" style="margin-top: 30px; width: 100%; padding: 12px; border: none; background: #eee; border-radius: 10px; cursor: pointer; font-weight: bold;">Voltar</button>
    </div>

    <script>
        const API_URL = 'https://icesoft-sistema-icesoft-api-v2.tm3i9u.easypanel.host/api';

        async function carregarFunil() {
            try {
                const res = await fetch(`${API_URL}/relatorios/funil`);
                const d = await res.json();

                // Atualiza Números
                document.getElementById('val-visitantes').innerText = d.visitantes;
                document.getElementById('val-visualizacoes').innerText = d.visualizacoes;
                document.getElementById('val-carrinho').innerText = d.carrinho;
                document.getElementById('val-checkout').innerText = d.checkout;
                document.getElementById('val-vendas').innerText = d.vendas;

                // Cálculos de Percentuais e Barras
                const calcularPerc = (parte, total) => total > 0 ? ((parte / total) * 100).toFixed(1) : 0;

                document.getElementById('per-visualizacoes').innerText = `${calcularPerc(d.visualizacoes, d.visitantes)}% abriram produtos`;
                document.getElementById('per-carrinho').innerText = `${calcularPerc(d.carrinho, d.visitantes)}% usaram o carrinho`;
                document.getElementById('per-checkout').innerText = `${calcularPerc(d.checkout, d.visitantes)}% foram pagar`;
                document.getElementById('per-vendas').innerText = `${calcularPerc(d.vendas, d.visitantes)}% compraram`;

                // Ajuste Visual das Barras
                document.getElementById('barra-visualizacoes').style.width = calcularPerc(d.visualizacoes, d.visitantes) + '%';
                document.getElementById('barra-carrinho').style.width = calcularPerc(d.carrinho, d.visitantes) + '%';
                document.getElementById('barra-checkout').style.width = calcularPerc(d.checkout, d.visitantes) + '%';
                document.getElementById('barra-vendas').style.width = calcularPerc(d.vendas, d.visitantes) + '%';

                // Métricas de Ouro
                document.getElementById('met-conversao').innerText = `${calcularPerc(d.vendas, d.visitantes)}%`;
                
                const abandono = d.checkout > 0 ? (100 - (d.vendas / d.checkout * 100)).toFixed(1) : 0;
                document.getElementById('met-abandono').innerText = `${abandono}%`;

                const eficiencia = d.visualizacoes > 0 ? (d.carrinho / d.visualizacoes * 100).toFixed(1) : 0;
                document.getElementById('met-eficiencia').innerText = `${eficiencia}%`;

            } catch (e) { alert("Erro ao carregar o funil."); }
        }

        window.onload = carregarFunil;
    </script>
</body>
</html>
