<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Caixas - Icesoft</title>
    <link rel="stylesheet" href="../gestao/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        /* Ajustes finos para as tabelas, herdando o layout full-width global */
        .card-historico { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .titulo-pagina { color: #333; margin-top: 0; margin-bottom: 20px; font-size: 1.8rem; }
        
        .input-mes { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif; outline: none; margin-left: 10px; }
        
        .tabela-moderna { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .tabela-moderna th { background: #f8f9fa; padding: 15px; text-align: left; color: #555; border-bottom: 2px solid #eee; }
        .tabela-moderna td { padding: 15px; border-bottom: 1px solid #f0f0f0; color: #444; }
        .tabela-moderna tbody tr:hover { background: #fdfdfd; }
        
        .btn-detalhes { background: #00bcd4; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 600; transition: 0.2s; }
        .btn-detalhes:hover { background: #0097a7; transform: translateY(-2px); }

        /* MODAL */
        .modal-detalhes { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 3000; }
        .modal-box { background: white; width: 90%; max-width: 1000px; border-radius: 20px; padding: 0; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-header { position: sticky; top: 0; background: white; padding: 20px 25px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; border-radius: 20px 20px 0 0; z-index: 10; }
        .modal-header h2 { margin: 0; color: #333; }
        .modal-body { padding: 25px; display: flex; gap: 20px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <aside class="menu-lateral">
        <div class="menu-item menu-user" title="Clientes acessando o Cardápio">
            <span class="material-symbols-outlined" style="color: white; font-size: 1.8rem;">person</span>
            <div id="online-notification-badge" class="badge-online" style="display: none;">0</div>
        </div>
        
        <a href="../dashboard/index.html" class="menu-item ativo" title="Dashboard e Gráficos">
            <span class="material-symbols-outlined">bar_chart</span>
        </a>
        
        <a href="../pdv/" class="menu-item" title="Balcão PDV">
            <span class="material-symbols-outlined">point_of_sale</span>
        </a>
        
        <a href="../mesas/" class="menu-item" title="Mesas e Comandas">
            <span class="material-symbols-outlined">table_restaurant</span>
            <span class="notification-badge" id="mesas-notification-badge" style="display: none;"></span>
        </a>
        
        <a href="../gestao/" class="menu-item" title="Gestão de Cardápio">
            <span class="material-symbols-outlined">restaurant_menu</span>
        </a>
        
        <a href="../delivery/" class="menu-item" title="Gestão Delivery">
            <span class="material-symbols-outlined">two_wheeler</span>
        </a>
        
        <a href="../kanban/" class="menu-item" title="Painel Kanban da Cozinha">
            <span class="material-symbols-outlined">view_kanban</span>
        </a>
        
        <a href="../integracoes/" class="menu-item" title="Integrações e WhatsApp">
            <span class="material-symbols-outlined">hub</span>
        </a>

        <a href="../financeiro/" class="menu-item" title="Financeiro">
            <span class="material-symbols-outlined">account_balance</span>
        </a>
        
        <div class="menu-item menu-sair" onclick="fazerLogout()" title="Sair do Sistema">
            <span class="material-symbols-outlined">logout</span>
        </div>
    </aside>

    <div class="conteudo-principal">
        
        <header class="gestao-header" style="margin-bottom: 25px;">
            <div class="titulo-area">
                <h1>AUDITORIA DE CAIXAS</h1>
            </div>
            <div class="botoes-area" style="display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 8px;">
                <label style="color: white; font-weight: bold; font-size: 0.85rem;">Período:</label>
                <input type="month" id="filtro-mes-caixa" class="input-mes" onchange="carregarDadosCaixa()" style="padding: 6px; border-radius: 6px; border: none; outline: none; margin-left: 0; font-family: 'Poppins', sans-serif;">
            </div>
        </header>

        <!-- SUBMENU DE NAVEGAÇÃO DOS RELATÓRIOS -->
        <div style="display: flex; gap: 10px; margin: 0 15px 25px 15px; overflow-x: auto; padding: 25px 5px 30px 5px; align-items: center; white-space: nowrap; -webkit-overflow-scrolling: touch; border-bottom: 1px solid #eee;">
            
            <button onclick="window.location.href='index.html'" style="background: white; color: #555; border: 1px solid #ccc; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-shrink: 0;" onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background='white'">
                <span class="material-symbols-outlined" style="font-size: 1.2rem; color: #022344;">dashboard</span> Visão Geral
            </button>
            
            <button onclick="window.location.href='produtos.html'" style="background: white; color: #555; border: 1px solid #ccc; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-shrink: 0;" onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background='white'">
                <span class="material-symbols-outlined" style="font-size: 1.2rem; color: #022344;">inventory_2</span> Raio-X de Produtos
            </button>
            
            <button onclick="window.location.href='vendas_periodo.html'" style="background: white; color: #555; border: 1px solid #ccc; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-shrink: 0;" onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background='white'">
                <span class="material-symbols-outlined" style="font-size: 1.2rem; color: #022344;">calendar_month</span> Vendas por Período
            </button>
            
            <button onclick="window.location.href='historico_caixas.html'" style="background: white; color: #555; border: 1px solid #ccc; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-shrink: 0;" onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background='white'">
                <span class="material-symbols-outlined" style="font-size: 1.2rem; color: #022344;">receipt_long</span> Auditoria de Caixas
            </button>
            
            <button onclick="window.location.href='funil.html'" style="background: white; color: #555; border: 1px solid #ccc; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-shrink: 0;" onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background='white'">
                <span class="material-symbols-outlined" style="font-size: 1.2rem; color: #022344;">stacked_bar_chart</span> Funil de Vendas
            </button>
            
            <button onclick="window.location.href='../crm/index.html'" style="background: white; color: #555; border: 1px solid #ccc; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-shrink: 0;" onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background='white'">
                <span class="material-symbols-outlined" style="font-size: 1.2rem; color: #022344;">handshake</span> CRM & Fidelidade
            </button>
        </div>

        <div class="card-historico">
            <table class="tabela-moderna">
                <thead>
                    <tr>
                        <th>Abertura</th>
                        <th>Fechamento</th>
                        <th>Cartão</th>
                        <th>Pix</th>
                        <th>Dinheiro</th>
                        <th>Despesas</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-caixas">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="modal-detalhes-caixa" class="modal-detalhes">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Raio-X (Caixa #<span id="detalhes-caixa-id"></span>)</h2>
                <button onclick="fecharDetalhesCaixa()" style="background: none; border: none; font-size: 1.8rem; cursor: pointer; color: #999;">&times;</button>
            </div>
            
            <div class="modal-body">
                <div style="flex: 1; min-width: 300px;">
                    <h3 style="color: #25D366; border-bottom: 2px solid #eee; padding-bottom: 10px;">🟢 Vendas</h3>
                    <table class="tabela-moderna">
                        <thead><tr><th>Hora</th><th>Forma</th><th>Valor</th></tr></thead>
                        <tbody id="corpo-tabela-detalhes-vendas"></tbody>
                    </table>
                </div>
                
                <div style="flex: 1; min-width: 300px;">
                    <h3 style="color: #f44336; border-bottom: 2px solid #eee; padding-bottom: 10px;">🔴 Despesas</h3>
                    <table class="tabela-moderna">
                        <thead><tr><th>Tipo</th><th>Motivo</th><th>Valor</th></tr></thead>
                        <tbody id="corpo-tabela-detalhes-movs"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://icesoft-sistema-icesoft-api-v2.tm3i9u.easypanel.host/api';

        window.onload = () => {
            const dataAtual = new Date();
            const mesFormatado = `${dataAtual.getFullYear()}-${String(dataAtual.getMonth() + 1).padStart(2, '0')}`;
            document.getElementById('filtro-mes-caixa').value = mesFormatado;
            carregarDadosCaixa();
        };

        async function carregarDadosCaixa() {
            const mes = document.getElementById('filtro-mes-caixa').value;
            const corpo = document.getElementById('corpo-tabela-caixas');
            corpo.innerHTML = '<tr><td colspan="7" style="text-align:center;">Buscando registros...</td></tr>';

            try {
                const res = await fetch(`${API_URL}/caixa/historico?mes=${mes}`);
                const dados = await res.json();
                corpo.innerHTML = '';
                
                if(dados.length === 0){
                    corpo.innerHTML = '<tr><td colspan="7" style="text-align:center;">Nenhum caixa fechado neste mês.</td></tr>';
                    return;
                }

                dados.forEach(c => {
                    corpo.innerHTML += `
                        <tr>
                            <td style="font-size: 0.9rem;">${c.dataAbertura}</td>
                            <td style="font-size: 0.9rem;">${c.dataFechamento}</td>
                            <td>R$ ${c.totalCartao.toFixed(2)}</td>
                            <td style="color: #25D366; font-weight: 600;">R$ ${c.totalPix.toFixed(2)}</td>
                            <td>R$ ${c.totalDinheiro.toFixed(2)}</td>
                            <td style="color: #f44336;">R$ ${c.totalDespesas.toFixed(2)}</td>
                            <td><button onclick="verDetalhesCaixa(${c.id})" class="btn-detalhes">Ver Detalhes</button></td>
                        </tr>`;
                });
            } catch (e) { corpo.innerHTML = '<tr><td colspan="7" style="color:red; text-align:center;">Erro na conexão com o banco de dados.</td></tr>'; }
        }

        async function verDetalhesCaixa(id) {
            document.getElementById('detalhes-caixa-id').innerText = id;
            document.getElementById('modal-detalhes-caixa').style.display = 'flex';
            const vTable = document.getElementById('corpo-tabela-detalhes-vendas');
            const mTable = document.getElementById('corpo-tabela-detalhes-movs');
            
            vTable.innerHTML = '<tr><td colspan="3">Carregando...</td></tr>';
            mTable.innerHTML = '<tr><td colspan="3">Carregando...</td></tr>';

            try {
                const res = await fetch(`${API_URL}/caixa/${id}/detalhes`);
                const dados = await res.json();
                
                vTable.innerHTML = dados.vendas.length ? dados.vendas.map(v => `<tr><td>${new Date(v.data_hora).toLocaleTimeString('pt-BR', {timeStyle: 'short'})}</td><td>${v.forma_pagamento}</td><td style="font-weight:600;">R$ ${Number(v.valor_total).toFixed(2)}</td></tr>`).join('') : '<tr><td colspan="3">Sem vendas</td></tr>';
                mTable.innerHTML = dados.movimentacoes.length ? dados.movimentacoes.map(m => `<tr><td style="color:${m.tipo.toLowerCase() === 'sangria' ? '#f44336' : '#25D366'}">${m.tipo}</td><td>${m.motivo || '-'}</td><td style="font-weight:600;">R$ ${Number(m.valor).toFixed(2)}</td></tr>`).join('') : '<tr><td colspan="3">Sem despesas</td></tr>';
            } catch (e) { console.error(e); }
        }

        function fecharDetalhesCaixa() { document.getElementById('modal-detalhes-caixa').style.display = 'none'; }
    </script>
</body>
</html>
